spring:
  application:
    name: nwk

  rabbitmq:
    host: ${NWK_RABBITMQ_HOST}
    port: ${NWK_RABBITMQ_PORT}
    username: ${NWK_RABBITMQ_USERNAME}
    password: ${NWK_RABBITMQ_PASSWORD}
    virtual-host: ${NWK_RABBITMQ_VHOST}

  mail:
    host: ${NWK_MAIL_HOST}
    port: ${NWK_MAIL_PORT}
    username: ${NWK_MAIL_USERNAME}
    password: ${NWK_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
